name: schedule-sync

# Writes the posting order set in https://sensei-hq.com/admin ("Make next") into src/lib/content/articles/index.json,
# before the 05:07 daily rebuild; the commit itself rebuilds the site. Uses the poster's Access service token.

on:
  schedule:
    - cron: '51 10 * * *'   # 04:51 Chicago (CST) / 05:51 in summer time
  workflow_dispatch:

concurrency:
  group: schedule-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    environment: posting
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the order from /admin
        env:
          ADMIN_ORIGIN: https://sensei-hq.com
          POSTER_CLIENT_ID: ${{ secrets.POSTER_CLIENT_ID }}
          POSTER_CLIENT_SECRET: ${{ secrets.POSTER_CLIENT_SECRET }}
        run: python3 scripts/sync_schedule.py
      - name: Commit
        run: |
          if ! git diff --quiet src/lib/content/articles/index.json; then
            git config user.name "sensei-hq posting"
            git config user.email "posting@sensei-hq.com"
            git add src/lib/content/articles/index.json
            git commit -m "Posting order from /admin ($(date -u +%F))"
            git push
          fi
