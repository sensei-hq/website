name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: Playwright 1.59.1 cannot install chromium on ubuntu-26.04
    # (ubuntu-latest); 24.04 is the newest image it supports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit
      - run: bun run test:scripts
      - run: bun run build
      # Install the browser for the Playwright the sites pin (the root has no Playwright, so a root bunx would fetch
      # the latest release and a chromium build the sites' runner cannot find).
      - run: bunx playwright install --with-deps chromium
        working-directory: sites/com
      - run: bun run test:e2e
        env:
          CI: true
